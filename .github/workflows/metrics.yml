name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}] # Updates every 12 hours
  workflow_dispatch:                # Allows you to run it manually
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: HNoise7676
          template: classic
          base: header, activity, community, repositories, metadata
          # This replicates your "Midnight Purple" / Dark aesthetic
          config_timezone: UTC
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Match your current preference for private commits
          config_order: base.header, isocalendar, languages
          queries_common_count_private: yes
