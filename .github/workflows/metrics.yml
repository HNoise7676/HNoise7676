name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: HNoise7676
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          
          # --- APPEARANCE SETTINGS ---
          # We'll use the 'neon' or 'terminal' base and inject purple CSS
          config_order: base.header, isocalendar, languages, habits
          extras_css: |
            .header { color: #bb86fc; }
            :root { --color-calendar-graph-day-L4: #7000ff; --color-calendar-graph-day-L3: #8e24aa; }
          
          # --- PLUGINS (The "Cramming" part) ---
          
          # 1. Detailed Languages
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          
          # 2. Coding Habits (Night owl vs Early bird)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # 3. Lines of Code changed
          plugin_lines: yes
          
          # 4. Achievement Badges (optional but cool)
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact

          # 5. a lot of extra stuff
          #plugin_notable: yes
          plugin_starlists: yes
          #plugin_music: yes
          plugin_isocalendar: yes
